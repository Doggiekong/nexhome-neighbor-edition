[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "tests_installer", "tests_launcher"]
pythonpath = ["."]
addopts = "--disable-socket --allow-unix-socket --timeout=30"
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
target-version = "py314"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
